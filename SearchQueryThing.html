<html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Verdana;}
/* Ensure the body takes up the full height for the overlay */
body {
    position: relative;
    min-height: 100vh;
    margin: 0;
}

/* Recreate the scanline overlay inside the HTML block */
body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; 
    left: 0; 
    bottom: 0; 
    right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0.03) 50%, rgba(0, 0, 0, 0.45) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.22), rgba(0, 255, 0, 0.11), rgba(0, 0, 255, 0.22));
    z-index: 9999;
    background-size: 100% 2px, 3px 100%;
    
    /* This is the magic that lets your mouse click the login fields */
    pointer-events: none; 
}
* {
    box-sizing: border-box;
}
 
.input-container {
    display: -ms-flexbox; /* IE10 */
    display: flex;
    width: 100%;
    margin-bottom: 15px;
}
 
.input-field:focus{
    border-style: solid;
    transition: 0.5;
    border-color: maroon;
    border-width: 2px;
}
 
.input-field {
    width: 100%;
    padding: 10px;
    outline: none;
    transition: 0.5s;
}
 
.btn:focus {

}
 
.btn {
    background-color: Maroon;
    color: white;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    width: 50%;
    opacity: 0.9;
    transition: 0.09s;
    border-radius: 3px;
    transition: 0.8s;
}

.btn:hover {
    background-color: Maroon;
    color: rgb(53, 9, 250);
    padding: 10px 20px;
    border: rgb(53, 9, 247);
    cursor: pointer;
    width: 50%;
    transition: 0.09s;
    border-radius: 10px;
    transition: 0.8s;
}
 
.btn:active {
    transition: 0.09s;
    transform: translateY(1px);
    box-shadow: 0 0px 0px 0 rgba(0, 0, 0, 0);
}
 
.btn2 {
    background-color: white;
    border: none;
    cursor: pointer;
}
 
p {
    font-family: Helvetica;
    margin-bottom: 5%;
}
</style>
